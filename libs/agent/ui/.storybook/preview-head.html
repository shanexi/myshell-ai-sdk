<script>
  // watchDarkModeInPreview.js
  function watchDarkModeInPreview() {
    const init = () => {
      const html = document.documentElement;
      if (!html) return;

      const updateDarkMode = (matches) => {
        if (matches) {
          html.classList.add('dark');
          // 不清楚原因，300 基本上不会有问题 200 刷新可能有问题
          setTimeout(() => html.setAttribute('data-theme', 'dark'), 300)
        } else {
          html.classList.remove('dark');
          setTimeout(() => html.setAttribute('data-theme', 'light'), 300)
        }
      };

      // 检测系统暗黑模式偏好
      const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');

      // 初始设置
      updateDarkMode(darkModeQuery.matches);

      // 监听系统主题变化
      darkModeQuery.addEventListener('change', (e) => {
        updateDarkMode(e.matches);
      });
    };

    if (document.readyState !== 'loading') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }
  }

  watchDarkModeInPreview();
</script>
